[project]
name = "algolearn-speak"
version = "0.1.0"
description = "Local voice MCP server for Claude Code: an ear (Whisper on MLX) and a voice (Kokoro on MLX), no cloud."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=2.1,<3",
    "mlx-whisper>=0.4.3",
    "mlx-audio>=0.5.1",
    "misaki[en]>=0.9",
    "silero-vad>=5.1",
    "sounddevice>=0.5.6",
    "numpy>=1.26",
    # spaCy model misaki (Kokoro G2P) needs; pinned here so `uv sync` never removes it
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.scripts]
algolearn-speak = "speak_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["speak_server.py"]

[tool.hatch.metadata]
allow-direct-references = true
