# Source of truth for AlgolearnSpeak.xcodeproj (generated with XcodeGen 2.46).
# Regenerate after editing:  cd ios/AlgolearnSpeak && xcodegen generate
name: AlgolearnSpeak
options:
  bundleIdPrefix: ai.algolearn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AlgolearnSpeak:
    type: application
    platform: iOS
    sources:
      - path: AlgolearnSpeak
    info:
      path: AlgolearnSpeak/Info.plist
      properties:
        CFBundleDisplayName: Algolearn Speak
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: Algolearn Speak streams your microphone to your Mac only while Claude is listening.
        NSLocalNetworkUsageDescription: Algolearn Speak connects to the speak server running on your Mac over your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.algolearn.speak
        CODE_SIGN_STYLE: Automatic
        # Leave empty here; select your personal team in Xcode
        # (Signing & Capabilities) or set it to your 10-character team ID.
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  AlgolearnSpeakTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: AlgolearnSpeak
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.algolearn.speak.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
schemes:
  AlgolearnSpeak:
    build:
      targets:
        AlgolearnSpeak: all
    test:
      targets:
        - AlgolearnSpeakTests
